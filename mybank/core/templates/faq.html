<!-- templates/faq.html -->
{% extends 'base.html' %}

{% block title %}FAQ - MyBank{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-8 mx-auto">
        <h1 class="text-center mb-4"><i class="fas fa-question-circle me-2"></i>Часто задаваемые вопросы</h1>
        
        <div class="accordion" id="faqAccordion">
            {% for faq in faqs %}
            <div class="accordion-item">
                <h2 class="accordion-header" id="heading{{ forloop.counter }}">
                    <button class="accordion-button {% if not forloop.first %}collapsed{% endif %}" type="button" data-bs-toggle="collapse" data-bs-target="#collapse{{ forloop.counter }}">
                        {{ faq.question }}
                    </button>
                </h2>
                <div id="collapse{{ forloop.counter }}" class="accordion-collapse collapse {% if forloop.first %}show{% endif %}" data-bs-parent="#faqAccordion">
                    <div class="accordion-body">
                        {{ faq.answer }}
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
        
        <div class="card mt-4 text-center bg-light">
            <div class="card-body">
                <h5>Не нашли ответ?</h5>
                <p>Свяжитесь с нашей службой поддержки</p>
                <a href="{% url 'core:contacts' %}" class="btn btn-primary">Связаться с нами</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
